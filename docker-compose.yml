version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: oficina_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-suasenha}
      POSTGRES_DB: oficinadb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: oficina_status
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-suasenha}@db:5432/oficinadb

volumes:
  postgres_data: